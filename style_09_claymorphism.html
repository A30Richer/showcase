<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLAY-HABIT — Gamified Claymorphism Academy</title>
    <meta name="description" content="สไตล์การออกแบบ Claymorphism Soft 3D Pastel ดินน้ำมันน่ารัก น่าใช้งาน">

    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@500;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-pastel: #f0f4f8;
            --clay-white: #ffffff;
            --clay-purple: #6c5ce7;
            --clay-coral: #ff7675;
            --clay-mint: #55efc4;
            --clay-yellow: #ffeaa7;
            --text-dark: #2d3748;
            --text-dim: #718096;

            --font-clay: 'Fredoka', 'Prompt', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            font-family: var(--font-clay);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(240, 244, 248, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .badge-style {
            background: var(--clay-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,255,255,0.4);
        }

        .btn-hub {
            background: var(--clay-white);
            border: none;
            color: var(--text-dark);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* Clay Card */
        .clay-card {
            background: var(--clay-white);
            border-radius: 28px;
            box-shadow: 12px 12px 24px #d1d9e6, -12px -12px 24px #ffffff, inset 4px 4px 8px rgba(255, 255, 255, 0.8);
            padding: 36px;
            margin-bottom: 32px;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-dim);
            padding: 24px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="website_design.html" class="brand">
            🧸 CLAY-HABIT
        </a>
        <span class="badge-style">Style #09: Claymorphism</span>
        <a href="website_design.html" class="btn-hub">
            <i data-lucide="grid"></i> 10 DESIGN VAULT
        </a>
    </header>

    <main class="container">
        
        <section class="clay-card" style="text-align:center;">
            <div style="background:var(--clay-coral); color:#fff; padding:6px 16px; border-radius:20px; display:inline-block; font-weight:700; margin-bottom:12px; box-shadow:inset -2px -2px 4px rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,255,255,0.4);">
                🔥 STREAK 7 DAYS ACTIVE!
            </div>
            <h1 style="font-size:2.2rem; margin-bottom:8px;">ระบบพัฒนาตนเองสไตล์ Gamified</h1>
            <p style="color:var(--text-dim);">สะสม แต้ม XP และปลดล็อกตราประทับในคลังดินน้ำมัน 3D</p>
        </section>

        <!-- Habit Checklists -->
        <section class="clay-card">
            <h2 style="font-size:1.4rem; margin-bottom:20px;">🎯 เป้าหมายประจำวันนี้</h2>

            <div style="display:flex; flex-direction:column; gap:16px;">
                <div style="background:var(--bg-pastel); padding:16px 24px; border-radius:20px; display:flex; justify-content:space-between; align-items:center; box-shadow:inset 3px 3px 6px #d1d9e6, inset -3px -3px 6px #ffffff;">
                    <div style="font-weight:700; font-size:1.1rem;">💻 Vibe Coding 30 นาที</div>
                    <button style="background:var(--clay-purple); color:#fff; border:none; padding:8px 18px; border-radius:14px; font-weight:700; font-family:var(--font-clay); cursor:pointer;" onclick="alert('ทำภารกิจสำเร็จ! ได้รับ +50 XP')">✓ สำเร็จ</button>
                </div>

                <div style="background:var(--bg-pastel); padding:16px 24px; border-radius:20px; display:flex; justify-content:space-between; align-items:center; box-shadow:inset 3px 3px 6px #d1d9e6, inset -3px -3px 6px #ffffff;">
                    <div style="font-weight:700; font-size:1.1rem;">📚 อ่านหนังสือ UI Design 1 บท</div>
                    <button style="background:var(--clay-mint); color:#000; border:none; padding:8px 18px; border-radius:14px; font-weight:700; font-family:var(--font-clay); cursor:pointer;" onclick="alert('ทำภารกิจสำเร็จ! ได้รับ +30 XP')">✓ สำเร็จ</button>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        © 2026 CLAY-HABIT — CLAYMORPHISM DESIGN SHOWCASE
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
