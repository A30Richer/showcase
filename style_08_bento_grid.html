<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENTO-AI — Holographic Grid Analytics Hub</title>
    <meta name="description" content="สไตล์การออกแบบ Bento Grid Holographic ดีไซน์กล่อง modular แบบ Apple/Vercel พร้อมขอบรุ้งเรืองแสง">

    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-bento: #0b0d14;
            --tile-bg: #131722;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --holo-purple: #a78bfa;
            --holo-cyan: #38bdf8;
            --holo-pink: #f472b6;

            --font-head: 'Outfit', 'Prompt', sans-serif;
            --font-code: 'Space Grotesk', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-bento);
            color: var(--text-main);
            font-family: var(--font-head);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 13, 20, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 1.25rem;
        }

        .badge-style {
            background: rgba(167, 139, 250, 0.15);
            border: 1px solid rgba(167, 139, 250, 0.3);
            color: var(--holo-purple);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .btn-hub {
            background: var(--tile-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* Bento Grid Matrix */
        .bento-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        @media (max-width: 900px) {
            .bento-matrix { grid-template-columns: 1fr; }
        }

        .bento-tile {
            background: var(--tile-bg);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Holographic Border Pseudo Element */
        .bento-tile::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 21px;
            padding: 1px;
            background: linear-gradient(135deg, var(--holo-purple), var(--holo-cyan), var(--holo-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .bento-span-2 { grid-column: span 2; }
        @media (max-width: 900px) { .bento-span-2 { grid-column: span 1; } }

        /* Footer */
        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="website_design.html" class="brand">
            <i data-lucide="layout-grid" style="color:var(--holo-purple);"></i> BENTO-AI
        </a>
        <span class="badge-style">Style #08: Bento Grid Holographic</span>
        <a href="website_design.html" class="btn-hub">
            <i data-lucide="grid"></i> 10 DESIGN VAULT
        </a>
    </header>

    <main class="container">
        
        <!-- Bento Grid Matrix -->
        <div class="bento-matrix">
            
            <!-- Tile 1: Wide Revenue Analytics -->
            <div class="bento-tile bento-span-2">
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.85rem; color:var(--text-dim); font-weight:600;">📊 ANNUAL REVENUE RUNRATE (MRR)</span>
                        <span style="background:rgba(56,189,248,0.15); color:var(--holo-cyan); font-size:0.75rem; padding:3px 10px; border-radius:10px;">+28.4% YoY</span>
                    </div>
                    <div style="font-size:2.8rem; font-weight:800; font-family:var(--font-code);">$1,480,250.00</div>
                </div>
                <div style="height:120px; background:rgba(0,0,0,0.3); border-radius:12px; margin-top:20px; display:flex; align-items:flex-end; gap:8px; padding:12px;">
                    <div style="flex:1; height:40%; background:var(--holo-purple); border-radius:4px;"></div>
                    <div style="flex:1; height:65%; background:var(--holo-cyan); border-radius:4px;"></div>
                    <div style="flex:1; height:85%; background:var(--holo-pink); border-radius:4px;"></div>
                    <div style="flex:1; height:100%; background:var(--holo-purple); border-radius:4px;"></div>
                </div>
            </div>

            <!-- Tile 2: Active Agents -->
            <div class="bento-tile">
                <div>
                    <div style="font-size:0.85rem; color:var(--text-dim); font-weight:600;">🤖 ACTIVE AGENT WORKERS</div>
                    <div style="font-size:2.4rem; font-weight:800; margin:10px 0; font-family:var(--font-code); color:var(--holo-pink);">12 AGENTS</div>
                    <p style="font-size:0.85rem; color:var(--text-dim);">ประมวลผลงานอัตโนมัติ 24/7</p>
                </div>
                <button style="background:linear-gradient(135deg, var(--holo-purple), var(--holo-pink)); border:none; color:#fff; padding:10px; border-radius:10px; font-weight:700; cursor:pointer; margin-top:16px;" onclick="alert('เพิ่ม Agent Subagent ใหม่เรียบร้อย!')">
                    + SPAWN NEW AGENT
                </button>
            </div>

        </div>

    </main>

    <footer class="footer">
        © 2026 BENTO-AI — BENTO GRID HOLOGRAPHIC SHOWCASE
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
